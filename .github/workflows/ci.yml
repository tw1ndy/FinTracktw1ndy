name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: write
concurrency:
  group: fintrack-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Commit generated lockfile to the PR branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          cp package-lock.json /tmp/fintrack-package-lock.json
          git fetch origin "$BRANCH_NAME"
          git checkout -B "$BRANCH_NAME" FETCH_HEAD
          cp /tmp/fintrack-package-lock.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add reproducible npm lockfile"
            git push origin "HEAD:$BRANCH_NAME"
          fi
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run security:smoke
      - name: Supabase two-user RLS integration
        if: ${{ vars.RUN_SUPABASE_INTEGRATION == 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_TEST_USER_A_EMAIL: ${{ secrets.SUPABASE_TEST_USER_A_EMAIL }}
          SUPABASE_TEST_USER_A_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_A_PASSWORD }}
          SUPABASE_TEST_USER_B_EMAIL: ${{ secrets.SUPABASE_TEST_USER_B_EMAIL }}
          SUPABASE_TEST_USER_B_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_B_PASSWORD }}
        run: |
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$NEXT_PUBLIC_SUPABASE_URL" > .env.local
          printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$NEXT_PUBLIC_SUPABASE_ANON_KEY" >> .env.local
          printf 'SUPABASE_TEST_USER_A_EMAIL=%s\n' "$SUPABASE_TEST_USER_A_EMAIL" >> .env.local
          printf 'SUPABASE_TEST_USER_A_PASSWORD=%s\n' "$SUPABASE_TEST_USER_A_PASSWORD" >> .env.local
          printf 'SUPABASE_TEST_USER_B_EMAIL=%s\n' "$SUPABASE_TEST_USER_B_EMAIL" >> .env.local
          printf 'SUPABASE_TEST_USER_B_PASSWORD=%s\n' "$SUPABASE_TEST_USER_B_PASSWORD" >> .env.local
          npm run test:supabase
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key
